    />

    <link rel="shortcut icon" href="images/favicon.ico" />

    <style>
      /* =========================================================
         Thank-You Page — Light Theme
         ========================================================= */

      /* Override body dark bg for this page only */
      body {
        background: #f4f6fb !important;
        color: #1a1a2e !important;
      }

      /* Header override — keep same as index */
      .site-header {
        background: white !important;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
      }

      /* ---- Page wrapper ---- */
      .ty-page {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        isolation: isolate;
        padding: 60px 16px;
        overflow: hidden;
        background: #f4f6fb;
      }

      /* Decorative blobs */
      .ty-page::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse 55% 45% at 15% 20%, rgba(221, 106, 47, 0.1) 0%, transparent 65%),
          radial-gradient(ellipse 50% 50% at 85% 75%, rgba(20, 48, 92, 0.07) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 50% 100%, rgba(221, 106, 47, 0.06) 0%, transparent 60%);
        pointer-events: none;
      }

      /* Subtle dot-grid pattern */
      .ty-page::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: radial-gradient(circle, rgba(20, 48, 92, 0.07) 1px, transparent 1px);
        background-size: 28px 28px;
        pointer-events: none;
      }

      /* ---- Card ---- */
      .ty-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 660px;
        background: #ffffff;
        border: 1px solid rgba(20, 48, 92, 0.08);
        border-radius: 24px;
        padding: clamp(36px, 6vw, 60px) clamp(24px, 6vw, 56px);
        text-align: center;
        box-shadow:
          0 4px 6px rgba(0, 0, 0, 0.04),
          0 20px 60px rgba(20, 48, 92, 0.1),
          0 0 0 1px rgba(221, 106, 47, 0.08);
      }

      /* Top accent bar */
      .ty-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 55%;
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--brand) 30%, #f5a155 70%, transparent);
        border-radius: 0 0 6px 6px;
      }

      /* ---- Confetti dots decoration ---- */
      .ty-dot {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: ty-float 7s ease-in-out infinite;
      }

      .ty-dot-1 {
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(221, 106, 47, 0.12) 0%, transparent 70%);
        top: -80px;
        right: -80px;
        animation-delay: 0s;
      }

      .ty-dot-2 {
        width: 160px;
        height: 160px;
        background: radial-gradient(circle, rgba(20, 48, 92, 0.08) 0%, transparent 70%);
        bottom: -60px;
        left: -60px;
        animation-delay: -3.5s;
      }

      .ty-dot-3 {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, rgba(221, 106, 47, 0.15) 0%, transparent 70%);
        top: 40%;
        left: -30px;
        animation-delay: -1.5s;
      }

      @keyframes ty-float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-16px) scale(1.05);
        }
      }

      /* ---- Check icon ---- */
      .ty-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: linear-gradient(135deg, #fff7f2 0%, #ffeadb 100%);
        border: 2px solid rgba(221, 106, 47, 0.25);
        margin-bottom: 20px;
        box-shadow: 0 8px 24px rgba(221, 106, 47, 0.18);
        animation: ty-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .ty-icon-wrap i {
        font-size: 38px;
        color: var(--brand);
      }

      @keyframes ty-pop {
        from {
          opacity: 0;
          transform: scale(0.4) rotate(-10deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      /* ---- Badge ---- */
      .ty-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand);
        background: linear-gradient(135deg, #fff3eb 0%, #ffeadb 100%);
        border: 1px solid rgba(221, 106, 47, 0.3);
        border-radius: 50px;
        padding: 5px 14px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(221, 106, 47, 0.12);
      }

      /* ---- Heading ---- */
      .ty-heading {
        font-size: clamp(26px, 5vw, 38px);
        font-weight: 700;
        line-height: 1.2;
        color: #0f1f3d;
        margin: 0 0 12px;
      }

      .ty-heading span {
        background: linear-gradient(90deg, #dd6a2f 0%, #f5a155 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* ---- Sub text ---- */
      .ty-sub {
        font-size: clamp(14px, 2vw, 15px);
        color: #5a6a85;
        line-height: 1.65;
        max-width: 460px;
        margin: 0 auto 24px;
      }

      .ty-sub strong {
        color: #0f1f3d !important;
        font-weight: 700;
      }

      /* ---- User detail pills ---- */
      .ty-user-details {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 24px;
      }

      .ty-detail-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #f4f6fb;
        border: 1px solid rgba(20, 48, 92, 0.1);
        border-radius: 50px;
        padding: 7px 16px;
        font-size: 13px;
        color: #2d3d5a;
        font-family: 'Inter', sans-serif;
        animation: ty-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      .ty-detail-pill:nth-child(2) {
        animation-delay: 0.08s;
      }
      .ty-detail-pill:nth-child(3) {
        animation-delay: 0.16s;
      }

      .ty-detail-pill i {
        font-size: 12px;
        color: var(--brand);
        flex-shrink: 0;
      }

      .ty-detail-pill span {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---- Divider ---- */
      .ty-divider {
        width: 100%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(20, 48, 92, 0.1) 30%,
          rgba(221, 106, 47, 0.2) 50%,
          rgba(20, 48, 92, 0.1) 70%,
          transparent
        );
        margin: 0 auto 28px;
      }

      /* ---- Steps ---- */
      .ty-steps {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 32px;
        text-align: left;
      }

      .ty-step {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        background: #f8faff;
        border: 1px solid rgba(20, 48, 92, 0.08);
        border-radius: 14px;
        padding: 14px 18px;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }

      .ty-step:hover {
        background: #fff7f2;
        border-color: rgba(221, 106, 47, 0.25);
        transform: translateX(4px);
        box-shadow: 0 4px 16px rgba(221, 106, 47, 0.1);
      }

      .ty-step-num {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        margin-top: 1px;
        box-shadow: 0 4px 10px rgba(221, 106, 47, 0.3);
      }

      .ty-step-body {
        flex: 1;
      }

      .ty-step-title {
        font-size: 14px;
        font-weight: 600;
        color: #0f1f3d;
        margin: 0 0 3px;
        font-family: 'Poppins', sans-serif;
      }

      .ty-step-desc {
        font-size: 13px;
        color: #6b7a99;
        margin: 0;
        line-height: 1.5;
      }

      /* ---- CTA Button ---- */
      .ty-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: 'Poppins', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
        border: none;
        border-radius: 50px;
        padding: 14px 34px;
        text-decoration: none;
        box-shadow: 0 8px 28px rgba(221, 106, 47, 0.32);
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          filter 0.25s;
        cursor: pointer;
      }

      .ty-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 36px rgba(221, 106, 47, 0.42);
        filter: brightness(1.07);
        color: #fff;
      }

      .ty-btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        font-size: 14px;
        flex-shrink: 0;
        transition: transform 0.25s;
      }

      .ty-btn:hover .ty-btn-icon {
        transform: translateX(3px);
      }

      /* ---- Footer note ---- */
      .ty-note {
        margin-top: 20px;
        font-size: 12px;
        color: #8a9ab8;
      }

      .ty-note a {
        color: var(--brand);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.2s;
        font-weight: 500;
      }

      .ty-note a:hover {
        color: var(--brand-dark);
      }

      /* =========================================================
         Responsive
         ========================================================= */
      @media (max-width: 575.98px) {
        .ty-page {
          padding: 40px 12px;
          align-items: flex-start;
          padding-top: 40px;
        }
        .ty-card {
          border-radius: 18px;
          padding: 28px 18px;
        }
        .ty-icon-wrap {
          width: 70px;
          height: 70px;
          margin-bottom: 16px;
        }
        .ty-icon-wrap i {
          font-size: 32px;
        }
        .ty-badge {
          font-size: 10px;
          padding: 4px 12px;
        }
        .ty-steps {
          gap: 10px;
        }
        .ty-step {
          padding: 12px 14px;
          gap: 12px;
        }
        .ty-step-num {
          width: 28px;
          height: 28px;
          font-size: 12px;
          border-radius: 8px;
        }
        .ty-btn {
          width: 100%;
          justify-content: center;
          font-size: 14px;
          padding: 13px 24px;
        }
        .ty-user-details {
          flex-direction: column;
          align-items: center;
          gap: 7px;
        }
        .ty-detail-pill {
          width: 100%;
          justify-content: center;
          font-size: 12px;
        }
        .ty-detail-pill span {
          max-width: 200px;
        }
        .ty-dot-1 {
          width: 140px;
          height: 140px;
          top: -50px;
          right: -50px;
        }
        .ty-dot-2 {
          width: 100px;
          height: 100px;
        }
        .ty-dot-3 {
          display: none;
        }
      }

      @media (max-width: 359.98px) {
        .ty-heading {
          font-size: 22px;
        }
        .ty-card {
          padding: 24px 14px;
        }
      }
    </style>
  </head>

  <body class="inter-fonts">
    <!-- ===== Google Tag Manager (noscript) ===== -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TNBX4HJ7"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>

    <!-- ===== Header ===== -->
    <header class="site-header" style="position: sticky; top: 0; z-index: 1030">
      <div class="custom-container">
        <div class="d-flex align-items-center gap-3" style="justify-content: space-between">
          <a href="index.html" class="d-inline-flex">
            <img src="images/logo-img.webp" alt="Oranium Tech" class="logo-img" />
          </a>
        </div>
      </div>
    </header>

    <!-- ===== Thank You Section ===== -->
    <main>
      <section class="ty-page">
        <div class="ty-card">
          <!-- Floating blobs -->
          <div class="ty-dot ty-dot-1" aria-hidden="true"></div>
          <div class="ty-dot ty-dot-2" aria-hidden="true"></div>
          <div class="ty-dot ty-dot-3" aria-hidden="true"></div>

          <!-- Check icon -->
          <div class="ty-icon-wrap">
            <i class="bi bi-check-lg" aria-hidden="true"></i>
          </div>

          <!-- Heading -->
          <h1 class="ty-heading poppins-fonts">
            Thank You<span id="ty-name-inline"></span><br />
            <span>for Joining Oranium Tech!</span>
          </h1>

          <!-- Sub text -->
          <p class="ty-sub">
            We've received your details. Our team will reach out to you within
            <strong>24 hours</strong> to guide you through the next steps.
          </p>

          <!-- User detail pills -->
          <div class="ty-user-details" id="tyUserDetails" style="display: none">
            <div class="ty-detail-pill" id="ty-pill-name" style="display: none">
              <i class="bi bi-person-fill"></i>
              <span id="ty-detail-name"></span>
            </div>
            <div class="ty-detail-pill" id="ty-pill-phone" style="display: none">
              <i class="bi bi-telephone-fill"></i>
              <span id="ty-detail-phone"></span>
            </div>
            <div class="ty-detail-pill" id="ty-pill-email" style="display: none">
              <i class="bi bi-envelope-fill"></i>
              <span id="ty-detail-email"></span>
            </div>
          </div>

          <div class="ty-divider" aria-hidden="true"></div>

          <!-- CTA -->
          <a href="/" class="ty-btn poppins-fonts">
            Back to Home
            <span class="ty-btn-icon" aria-hidden="true">
              <i class="bi bi-house-fill"></i>
            </span>
          </a>

          <!-- Footer note -->
          <p class="ty-note inter-fonts">Questions? Reach us at call <a href="tel:+918072363772">+91 80723 63772</a></p>
        </div>
      </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ===== Read query params & populate user details ===== -->
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);

        const name = params.get('name') || '';
        const phone = params.get('phone') || '';
        const email = params.get('email') || '';

        if (name) {
          document.getElementById('ty-name-inline').textContent = ', ' + name.split(' ')[0];
        }

        let anyDetail = false;

        if (name) {
          document.getElementById('ty-detail-name').textContent = name;
          document.getElementById('ty-pill-name').style.display = 'inline-flex';
          anyDetail = true;
        }
        if (phone) {
          document.getElementById('ty-detail-phone').textContent = phone;
          document.getElementById('ty-pill-phone').style.display = 'inline-flex';
          anyDetail = true;
        }
        if (email) {
          document.getElementById('ty-detail-email').textContent = email;
          document.getElementById('ty-pill-email').style.display = 'inline-flex';
          anyDetail = true;
        }

        if (anyDetail) {
          document.getElementById('tyUserDetails').style.display = 'flex';
        }
      })();
    </script>
  </body>
</html>
